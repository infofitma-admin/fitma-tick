name: Build Fitma Tick

# Builds installers for Windows + macOS (+ Linux) on real runners, unsigned,
# then publishes them to a GitHub Release with direct download links.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitma-tick-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: all
      - name: Flatten
        run: |
          mkdir -p out
          find all -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.0
          NOTES="Fitma Tick — unsigned test build.
          Windows: download the Setup .exe, run it, then on the blue warning click **More info -> Run anyway**.
          macOS: download the .dmg, open it, drag Fitma Tick to Applications, then **right-click the app -> Open** (one time), and allow **Screen Recording** in System Settings > Privacy & Security.
          Sign in with your Fitma email + password (reset one in the Workspace > Team & access)."
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Fitma Tick $TAG" --notes "$NOTES" out/* \
            || gh release upload "$TAG" --repo "${{ github.repository }}" out/* --clobber
