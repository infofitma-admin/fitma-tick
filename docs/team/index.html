<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#273545">
<title>Fitma Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f5f6f7; --border:#d8dddf;
  --fg:#273545; --muted:#5d7488; --faint:#92aabe;
  --primary:#273545; --accent:#3d5c71; --accent-soft:#e2e8ee;
  --good:#2f8f5b; --good-soft:#dcefe3; --warn:#b07a28; --warn-soft:#f3e8d4; --crit:#c0453f; --crit-soft:#f4e0df;
  --radius:14px; --shadow:0 1px 2px rgba(39,53,69,.06),0 8px 24px rgba(39,53,69,.07);
  --ff:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --fh:"Corben","Montserrat",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2{font-family:var(--fh);font-weight:700;margin:0}
h3{font-family:var(--ff);font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.top img{height:34px;width:34px;border-radius:8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .v{font-family:var(--fh);font-size:26px;font-weight:700;margin-top:3px}
.stat .s{font-size:12px;color:var(--faint);margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.memrow{cursor:pointer}
.memrow:hover{background:var(--surface-2)}
.detail td{background:var(--surface-2);padding:0}
.detail table{margin:0}
.detail th,.detail td{border-bottom:1px solid var(--border)}
.bar{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.gate{max-width:360px;margin:60px auto;text-align:center}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin:12px 0;font-family:var(--ff)}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-family:var(--ff);font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.muted{color:var(--muted)}
.err{color:var(--crit);font-size:13px;margin-top:8px}
.foot{color:var(--faint);font-size:12px;margin-top:16px;text-align:center}
.chip{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.k2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:3px}
select,input[type=number],input[type=month],textarea{font-family:var(--ff);font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.scorechip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px 8px;margin:2px}
#report{display:none}
#report .rpt{max-width:720px;margin:0 auto;padding:28px;color:var(--fg)}
#report .rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--primary);padding-bottom:12px;margin-bottom:18px}
#report .rbrand{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--primary)}
#report .score{border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
#report .score .v{font-family:var(--fh);font-size:34px;font-weight:700}
@media print{ .wrap{display:none!important} #report{display:block} @page{margin:12mm} body{background:#fff} }
</style>
</head>
<body>
<div id="report"></div>
<div class="wrap" id="app">
  <div class="gate card" style="padding:26px">
    <div style="font-family:var(--fh);font-size:20px;font-weight:700">Fitma Team</div>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Enter the admin PIN to view the team dashboard.</p>
    <input id="pin" type="password" placeholder="Admin PIN" autocomplete="off">
    <button class="btn" id="go" style="width:100%">View dashboard</button>
    <div class="err" id="gerr" hidden></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://adyqhpqugdlksqzpscwm.supabase.co";
const SB_KEY="sb_publishable_l3HBtg1KUO6nBZkwxXqQvw_9uPyXSRz";
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById("app");
let adminPin=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>(n||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const fmtH=m=>{m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),mm=m%60;return h+"h"+(mm?" "+mm+"m":"");};
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
// Punctuality per Fitma's rule: on time=at/before scheduled start; 1-5 min=Needs improvement; >5 min=At risk (even 1 min counts).
function schedStart(dateStr,role,name){ if(role==='founder')return null; const fri=new Date(dateStr+"T00:00:00").getDay()===5; if(fri&&(role==='senior'||/azri/i.test(name||'')))return "09:30"; return "09:00"; }
function lateMins(startStr,sched){ if(!startStr||!sched)return null; const p=s=>{const a=s.split(":");return (+a[0])*60+(+a[1]);}; return p(startStr)-p(sched); }
function punct(lm){ if(lm==null)return{label:'—',cls:'muted'}; if(lm<=0)return{label:'On time',cls:'good'}; if(lm<=5)return{label:'Needs improvement',cls:'warn'}; return{label:'At risk',cls:'crit'}; }

function gate(){
  const go=()=>{const pin=document.getElementById("pin").value.trim();if(pin){try{localStorage.setItem("fitma_pin",pin)}catch(e){}load(pin);}};
  document.getElementById("go").onclick=go;
  document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  let saved=null;try{saved=localStorage.getItem("fitma_pin")}catch(e){}
  if(saved)load(saved);
}
async function load(pin){
  adminPin=pin;
  app.innerHTML=`<div class="sub">Loading real data from WebWork…</div>`;
  const {data,error}=await sb.rpc("fitma_team_report",{p_pin:pin});
  if(error||!data||data.error){
    try{localStorage.removeItem("fitma_pin")}catch(e){}
    app.innerHTML=`<div class="gate card" style="padding:26px"><div style="font-family:var(--fh);font-size:20px;font-weight:700">Fitma Team</div>
      <p class="err" style="margin:8px 0 0">${data&&data.error?'Wrong PIN. Try again.':'Could not load. '+esc(error?error.message:'')}</p>
      <input id="pin" type="password" placeholder="Admin PIN" autocomplete="off"><button class="btn" id="go" style="width:100%">View dashboard</button></div>`;
    gate();return;
  }
  render(data);
}

function render(d){
  const members=d.members||[], att=d.attendance||[];
  window._admin={members,att};
  const byId={}; members.forEach(m=>byId[m.webwork_id]={m,rows:[]});
  att.forEach(a=>{ if(byId[a.webwork_id]) byId[a.webwork_id].rows.push(a); });
  const dates=att.map(a=>a.work_date).sort();
  const from=dates[0], to=dates[dates.length-1];
  // team totals
  let teamMin=0,lateTotal=0; const actAll=[];
  const people=members.map(m=>{
    const rows=(byId[m.webwork_id].rows||[]).slice().sort((a,b)=>a.work_date<b.work_date?-1:1);
    const worked=rows.filter(r=>r.worked_minutes>0||r.start_time);
    const totalMin=rows.reduce((s,r)=>s+(r.worked_minutes||0),0);
    const daysWorked=worked.length;
    const acts=rows.filter(r=>r.start_time&&r.activity_pct!=null).map(r=>r.activity_pct);
    const avgAct=acts.length?Math.round(acts.reduce((a,b)=>a+b,0)/acts.length):null;
    const late=rows.filter(r=>r.working_day&&r.start_time&&(lateMins(r.start_time,schedStart(r.work_date,m.role,m.name))||0)>0).length;
    const early=rows.filter(r=>r.is_left_early).length;
    const last=rows[rows.length-1];
    teamMin+=totalMin; lateTotal+=late; if(avgAct!=null) actAll.push(avgAct);
    return {m,rows,totalMin,daysWorked,avgAct,late,early,last};
  }).sort((a,b)=>b.totalMin-a.totalMin);
  const avgActTeam=actAll.length?Math.round(actAll.reduce((a,b)=>a+b,0)/actAll.length):0;

  const roleName={intern:'Intern',senior:'Senior',founder:'Founder',admin:'Admin'};
  app.innerHTML=`
   <div class="top"><img src="../tick/app/mascot.png" alt="" onerror="this.style.display='none'"><div>
     <h1 style="font-size:22px">Fitma Team</h1></div>
     <span class="chip" style="margin-left:auto">${from?fmtDate(from):''} – ${to?fmtDate(to):''}</span></div>
   <div class="sub">Live attendance &amp; hours from WebWork · updates daily · <a href="#" id="logout" style="color:var(--accent)">lock</a></div>
   <div class="grid">
     <div class="card stat"><div class="k">Team hours</div><div class="v">${fmtH(teamMin)}</div><div class="s">this period</div></div>
     <div class="card stat"><div class="k">Avg activity</div><div class="v">${avgActTeam}%</div><div class="s">tracked members</div></div>
     <div class="card stat"><div class="k">Late starts</div><div class="v">${lateTotal}</div><div class="s">across the team</div></div>
     <div class="card stat"><div class="k">Members</div><div class="v">${members.length}</div><div class="s">tracked</div></div>
   </div>
   <div class="card">
     <div class="sec-head"><h3>By member</h3><span class="chip">tap a row for daily detail</span></div>
     <div style="overflow-x:auto"><table><thead><tr>
       <th>Member</th><th class="n">Hours</th><th class="n">Avg/day</th><th class="n">Activity</th><th class="n">Days</th><th class="n">Late</th><th>Last seen</th>
     </tr></thead><tbody id="rows"></tbody></table></div>
   </div>
   <div class="card" id="perfcard">
     <div class="sec-head"><h3>Monthly performance</h3><span class="chip">scores out of 10</span></div>
     <div style="padding:0 16px 16px">
       <div class="row" style="display:flex;gap:10px;flex-wrap:wrap">
         <label style="flex:1;min-width:150px"><div class="k2">Member</div><select id="pf_mem"></select></label>
         <label style="width:150px"><div class="k2">Month</div><input id="pf_month" type="month"></label>
       </div>
       <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
         <label style="flex:1;min-width:110px"><div class="k2">Project mgmt</div><input id="pf_pm" type="number" min="0" max="10" step="1"></label>
         <label style="flex:1;min-width:110px"><div class="k2">Time mgmt</div><input id="pf_tm" type="number" min="0" max="10" step="1"></label>
         <label style="flex:1;min-width:110px"><div class="k2">Eager to learn</div><input id="pf_el" type="number" min="0" max="10" step="1"></label>
       </div>
       <label style="display:block;margin-top:8px"><div class="k2">Notes (shown to the employee)</div><textarea id="pf_notes" rows="2" style="width:100%"></textarea></label>
       <div style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap">
         <label style="display:flex;align-items:center;gap:7px;font-size:13px"><input id="pf_pub" type="checkbox"> Published (employee can see it after the month ends)</label>
         <button class="btn ghost" id="pf_print" style="margin-left:auto">Print report</button>
         <button class="btn" id="pf_save">Save score</button>
       </div>
       <div id="pf_msg" class="muted" style="font-size:13px;margin-top:8px"></div>
       <div id="pf_existing" style="margin-top:12px"></div>
     </div>
   </div>
   <div class="foot">Fitma Tick · internal team dashboard · data synced from WebWork Tracker</div>`;
  setupPerf(members, d.performance||[]);
  const tb=document.getElementById("rows");
  people.forEach((p,idx)=>{
    const target=p.m.target_minutes;
    const avgDay=p.daysWorked?p.totalMin/p.daysWorked:0;
    const targetPill=target?(avgDay>=target?'good':avgDay>=target*0.85?'warn':'crit'):'muted';
    const actPill=p.avgAct==null?'muted':(p.avgAct>=70?'good':p.avgAct>=40?'warn':'crit');
    const tr=document.createElement("tr");tr.className="memrow";
    tr.innerHTML=`<td><div style="display:flex;align-items:center;gap:9px"><span class="avatar">${esc(initials(p.m.name))}</span>
        <div><div style="font-weight:600">${esc(p.m.name)}</div><div class="muted" style="font-size:11px">${roleName[p.m.role]||esc(p.m.role||'')}</div></div></div></td>
      <td class="n" style="font-weight:700">${fmtH(p.totalMin)}</td>
      <td class="n"><span class="pill ${targetPill}">${fmtH(avgDay)}${target?' / '+fmtH(target):''}</span></td>
      <td class="n">${(p.m.role==='founder'||p.avgAct==null)?'<span class="muted">manual</span>':`<span class="pill ${actPill}">${p.avgAct}%</span>`}</td>
      <td class="n">${p.daysWorked}</td>
      <td class="n">${p.late?`<span class="pill crit">${p.late}</span>`:'<span class="muted">0</span>'}</td>
      <td>${p.last&&p.last.start_time?esc(p.last.start_time)+(p.last.end_time?'–'+esc(p.last.end_time):'')+' <span class="muted" style="font-size:11px">'+fmtDate(p.last.work_date)+'</span>':'<span class="muted">—</span>'}</td>`;
    const det=document.createElement("tr");det.className="detail";det.hidden=true;
    det.innerHTML=`<td colspan="7"><table><thead><tr><th>Day</th><th>In</th><th>Out</th><th class="n">Worked</th><th class="n">Activity</th><th>Status</th></tr></thead><tbody>
      ${p.rows.slice().sort((a,b)=>a.work_date<b.work_date?1:-1).map(r=>`<tr>
        <td>${fmtDate(r.work_date)}${r.working_day?'':' <span class="pill muted">off</span>'}</td>
        <td>${r.start_time?esc(r.start_time):'<span class="muted">—</span>'}</td>
        <td>${r.end_time?esc(r.end_time):'<span class="muted">—</span>'}</td>
        <td class="n">${r.worked_minutes?fmtH(r.worked_minutes):'<span class="muted">—</span>'}</td>
        <td class="n">${r.activity_pct==null?'<span class="muted">—</span>':r.activity_pct+'%'}</td>
        <td>${(()=>{ if(!r.working_day) return '<span class="muted">—</span>'; if(p.m.role==='founder') return '<span class="pill muted">manual</span>'; if(!r.start_time) return '<span class="pill crit">Absent</span>'; const pu=punct(lateMins(r.start_time,schedStart(r.work_date,p.m.role,p.m.name))); const e=r.is_left_early?' · left early':''; return '<span class="pill '+pu.cls+'">'+pu.label+'</span>'+e; })()}</td>
      </tr>`).join("")}
    </tbody></table></td>`;
    tr.onclick=()=>{det.hidden=!det.hidden;};
    tb.appendChild(tr);tb.appendChild(det);
  });
  document.getElementById("logout").onclick=e=>{e.preventDefault();try{localStorage.removeItem("fitma_pin")}catch(x){}location.reload();};
}
function setupPerf(members, perf){
  const sel=document.getElementById("pf_mem");
  const roster=members.filter(m=>m.role!=='admin');
  sel.innerHTML=roster.map(m=>`<option value="${m.webwork_id}">${esc(m.name)}</option>`).join("");
  const now=new Date(); const lm=new Date(now.getFullYear(),now.getMonth()-1,1);
  const lmStr=lm.getFullYear()+"-"+String(lm.getMonth()+1).padStart(2,"0");
  document.getElementById("pf_month").value=lmStr;
  const byKey={}; perf.forEach(p=>byKey[p.webwork_id+"|"+p.period]=p);
  const nameOf=id=>{const m=roster.find(x=>String(x.webwork_id)===String(id));return m?m.name:id;};
  function prefill(){
    const k=sel.value+"|"+document.getElementById("pf_month").value; const p=byKey[k];
    document.getElementById("pf_pm").value=p?(p.project_mgmt??''):'';
    document.getElementById("pf_tm").value=p?(p.time_mgmt??''):'';
    document.getElementById("pf_el").value=p?(p.eager_to_learn??''):'';
    document.getElementById("pf_notes").value=p?(p.notes||''):'';
    document.getElementById("pf_pub").checked=p?!!p.published:false;
  }
  sel.onchange=prefill; document.getElementById("pf_month").onchange=prefill; prefill();
  function renderExisting(){
    const el=document.getElementById("pf_existing");
    const rows=perf.slice().sort((a,b)=>a.period<b.period?1:-1);
    el.innerHTML=rows.length?`<div class="k2" style="margin-bottom:6px">Saved scores</div><div style="overflow-x:auto"><table><thead><tr><th>Member</th><th>Month</th><th class="n">PM</th><th class="n">TM</th><th class="n">EL</th><th>Status</th></tr></thead><tbody>
      ${rows.map(p=>`<tr><td>${esc(nameOf(p.webwork_id))}</td><td>${esc(p.period)}</td><td class="n">${p.project_mgmt??'—'}</td><td class="n">${p.time_mgmt??'—'}</td><td class="n">${p.eager_to_learn??'—'}</td><td>${p.published?'<span class="pill good">published</span>':'<span class="pill muted">draft</span>'}</td></tr>`).join("")}
      </tbody></table></div>`:'';
  }
  renderExisting();
  const gVal=id=>{const v=document.getElementById(id).value;return v===''?null:Math.max(0,Math.min(10,Math.round(+v)));};
  document.getElementById("pf_print").onclick=()=>{
    adminPrintReport(Number(sel.value), nameOf(sel.value), document.getElementById("pf_month").value,
      {project_mgmt:gVal("pf_pm"),time_mgmt:gVal("pf_tm"),eager_to_learn:gVal("pf_el"),notes:document.getElementById("pf_notes").value.trim()});
  };
  document.getElementById("pf_save").onclick=async()=>{
    const msg=document.getElementById("pf_msg");
    const g=id=>{const v=document.getElementById(id).value;return v===''?null:Math.max(0,Math.min(10,Math.round(+v)));};
    const payload={p_pin:adminPin,p_webwork_id:Number(sel.value),p_period:document.getElementById("pf_month").value,
      p_pm:g("pf_pm"),p_tm:g("pf_tm"),p_eager:g("pf_el"),p_notes:document.getElementById("pf_notes").value.trim()||null,p_published:document.getElementById("pf_pub").checked};
    if(!payload.p_period){msg.textContent="Pick a month.";return;}
    msg.textContent="Saving…";
    const {data,error}=await sb.rpc("fitma_set_score",payload);
    if(error||!data||data.error){msg.innerHTML='<span style="color:var(--crit)">Could not save. '+esc(error?error.message:(data&&data.error||''))+'</span>';return;}
    const k=sel.value+"|"+payload.p_period;
    const rec={webwork_id:Number(sel.value),period:payload.p_period,project_mgmt:payload.p_pm,time_mgmt:payload.p_tm,eager_to_learn:payload.p_eager,notes:payload.p_notes,published:payload.p_published};
    byKey[k]=rec; const i=perf.findIndex(x=>x.webwork_id===rec.webwork_id&&x.period===rec.period); if(i>=0)perf[i]=rec; else perf.push(rec);
    msg.innerHTML='<span style="color:var(--good)">Saved ✓</span>'; renderExisting();
  };
}
function monthSummaryA(period, mid, role, name){
  const rows=((window._admin&&window._admin.att)||[]).filter(r=>r.webwork_id===mid && r.work_date.slice(0,7)===period);
  const present=rows.filter(r=>r.start_time&&r.working_day);
  const graded=present.map(r=>lateMins(r.start_time,schedStart(r.work_date,role,name))).filter(lm=>lm!=null);
  const onT=graded.filter(lm=>lm<=0).length, ni=graded.filter(lm=>lm>0&&lm<=5).length, ar=graded.filter(lm=>lm>5).length;
  return {days:present.length,onTime:onT,needs:ni,risk:ar,pct:graded.length?Math.round(onT/graded.length*100):null};
}
window.adminPrintReport=function(mid, name, period, p){
  if(!period){document.getElementById("pf_msg").textContent="Pick a month to print.";return;}
  const m=(window._admin.members||[]).find(x=>x.webwork_id===mid)||{};
  const role=m.role;
  const mn=new Date(period+"-01T00:00:00").toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const s=monthSummaryA(period, mid, role, name);
  const sc=(l,v)=>`<div class="score"><div style="font-size:11px;color:#5d7488;text-transform:uppercase;letter-spacing:.04em;font-weight:600">${l}</div><div class="v">${v==null?'—':v+'<span style="font-size:15px;color:#92aabe">/10</span>'}</div></div>`;
  const vals=[p.project_mgmt,p.time_mgmt,p.eager_to_learn].filter(v=>v!=null);
  const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';
  document.getElementById("report").innerHTML=`<div class="rpt">
    <div class="rhead"><div><div class="rbrand">Fitma</div><div style="color:#5d7488;font-size:13px">Monthly Performance Report</div></div>
      <div style="text-align:right"><div style="font-weight:600">${esc(name||'')}</div><div style="color:#5d7488;font-size:13px">${esc(mn)}</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${sc('Project management',p.project_mgmt)}${sc('Time management',p.time_mgmt)}${sc('Eager to learn',p.eager_to_learn)}</div>
    <div style="text-align:center;margin-top:14px;font-family:'Corben',serif;font-size:16px">Overall average: <b>${avg}/10</b></div>
    ${p.notes?`<div style="margin-top:18px"><div style="font-weight:600;margin-bottom:4px">Manager's notes</div><div style="color:#273545">${esc(p.notes)}</div></div>`:''}
    <div style="margin-top:18px"><div style="font-weight:600;margin-bottom:6px">Attendance — ${esc(mn)}</div>
      <div style="color:#273545;font-size:14px">Days present: <b>${s.days}</b> &nbsp;·&nbsp; On time: <b>${s.onTime}</b> &nbsp;·&nbsp; Needs improvement: <b>${s.needs}</b> &nbsp;·&nbsp; At risk: <b>${s.risk}</b>${s.pct!=null?` &nbsp;·&nbsp; Punctuality: <b>${s.pct}%</b>`:''}</div></div>
    <div style="margin-top:28px;color:#92aabe;font-size:12px;border-top:1px solid #d8dddf;padding-top:10px">Generated from Fitma Workspace · ${new Date().toLocaleDateString()}</div>
  </div>`;
  setTimeout(()=>window.print(),120);
};
gate();
</script>
