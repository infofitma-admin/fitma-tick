<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#273545">
<title>Fitma Tick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail + scrolling work area; auth/onboarding are centered single cards.
   Fitma brand: Corben headlines + Montserrat body; Midnight/Harbor/Soft/Sky blue palette. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f1f1f1; --border:#d8dddf;
  --fg:#273545; --muted:#5d7488; --faint:#92aabe;
  --primary:#273545; --primary-ink:#ffffff; --primary-soft:#e6ebef;
  --accent:#3d5c71; --accent-2:#6a8599; --accent-soft:#e2e8ee;
  --cream:#f1f1f1; --heart:#c0453f;
  --good:#2f8f5b; --good-soft:#dcefe3; --warn:#b07a28; --warn-soft:#f3e8d4;
  --crit:#c0453f; --crit-soft:#f4e0df;
  --shadow:0 1px 2px rgba(39,53,69,.06),0 8px 24px rgba(39,53,69,.08);
  --radius:14px;
  --ff:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --fh:"Corben","Montserrat",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a23; --surface:#1b2733; --surface-2:#223040; --border:#2f4255;
  --fg:#e8eef4; --muted:#9db0c1; --faint:#677d90;
  --primary:#6a89a8; --primary-ink:#0c131b; --primary-soft:#24313f;
  --accent:#2dd4bf; --accent-soft:#113a37;
  --cream:#e8dcc2; --heart:#f0756f;
  --good:#4ade80; --good-soft:#123021; --warn:#fbbf24; --warn-soft:#3a2d0c;
  --crit:#f87171; --crit-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121a23; --surface:#1b2733; --surface-2:#223040; --border:#2f4255;
  --fg:#e8eef4; --muted:#9db0c1; --faint:#677d90;
  --primary:#6a89a8; --primary-ink:#0c131b; --primary-soft:#24313f;
  --accent:#2dd4bf; --accent-soft:#113a37;
  --cream:#e8dcc2; --heart:#f0756f;
  --good:#4ade80; --good-soft:#123021; --warn:#fbbf24; --warn-soft:#3a2d0c;
  --crit:#f87171; --crit-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--fh);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3,h4{font-family:var(--ff);margin:0;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons / controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);padding:9px 15px;border-radius:10px;font-weight:600;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--crit);border-color:var(--border)}
.btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--fg)}
.field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- auth / onboarding ---------- */
.center-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:40px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:400px;padding:30px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{width:40px;height:40px;flex:none;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(39,53,69,.14))}
.logo-lg{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(39,53,69,.16))}
.brand-lg{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
.brand-name{font-family:var(--fh);font-weight:700;font-size:19px;letter-spacing:-.02em}
.msg{padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:20px}
.tabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:18px 14px;gap:4px;position:sticky;top:0;height:100vh}
.rail .brand{padding:0 6px 14px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--muted);
  font-weight:600;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.on{background:var(--primary-soft);color:var(--primary)}
.nav-item svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.me{display:flex;align-items:center;gap:9px;padding:6px}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.work{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding:14px max(18px,env(safe-area-inset-right,0px)) 14px 22px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:17px}
.content{padding:22px;max-width:1100px;width:100%;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px}
.stat{padding:16px 18px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-family:var(--fh);font-size:27px;font-weight:600;margin-top:4px}
.stat .sub{font-size:12px;color:var(--faint);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.sec-head h3{font-size:15px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.productive>i{background:var(--good)}
.bar.unproductive>i{background:var(--heart)}
.timer-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer-clock{font-family:var(--fh);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--crit);display:inline-block}
.dot.live{background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.modal-bg{position:fixed;inset:0;background:rgba(10,11,22,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal{width:100%;max-width:440px;padding:24px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.invite-link{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:9px 11px;word-break:break-all}
.plan-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.price{font-family:var(--fh);font-size:30px;font-weight:600}
.price small{font-size:13px;color:var(--muted);font-weight:500}
.feat{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.feat svg{width:15px;height:15px;color:var(--accent);flex:none;margin-top:2px}
.loader{display:grid;place-items:center;min-height:100%;color:var(--muted);gap:12px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.2s;width:230px;height:100%}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
.menu-btn{display:none}
@media (min-width:761px){.menu-btn{display:none!important}}
/* reusable popup menu (export, row actions) + kebab button */
.menu-pop{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);min-width:178px;max-height:min(340px,62vh);overflow-y:auto;padding:5px;display:flex;flex-direction:column;animation:popin .09s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;font:inherit;font-size:13.5px;color:var(--fg);cursor:pointer}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--heart)}
.menu-item svg{width:15px;height:15px;flex:none;opacity:.8}
.menu-sep{height:1px;background:var(--border);margin:4px 2px}
.kebab{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--muted)}
.kebab:hover{background:var(--surface-2);color:var(--fg)}
.kebab svg{width:17px;height:17px}
.filt{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg);font:inherit;font-size:13.5px;max-width:200px}
/* custom dropdown — styled trigger that drives a hidden native <select> */
.csel{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;min-width:132px;max-width:230px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:13.5px;line-height:1.25;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s;-webkit-tap-highlight-color:transparent}
.csel:hover{border-color:var(--faint);background:var(--surface-2)}
.csel.open,.csel:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.csel>span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel>svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .16s}
.csel.open>svg{transform:rotate(180deg)}
.csel.disabled{opacity:.55;cursor:not-allowed;background:var(--surface-2);box-shadow:none;border-color:var(--border)}
.csel-block{display:flex;width:100%;max-width:none;min-width:0}
.menu-item>span{flex:1}
.menu-item .mi-ck{width:15px;height:15px;color:var(--accent);flex:none;margin-left:6px}
.menu-item.sel{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<script>try{document.documentElement.dataset.theme='light'}catch(e){}</script>
<div id="app"><div class="loader"><div class="spin"></div><div>Starting Fitma Tick…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://adyqhpqugdlksqzpscwm.supabase.co";
const SUPA_KEY="sb_publishable_l3HBtg1KUO6nBZkwxXqQvw_9uPyXSRz";
const app=document.getElementById("app");
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const DOTS='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';
const IC_PENCIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const IC_TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const IC_ARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/></svg>';
const IC_UNARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M12 18v-6M9 15l3-3 3 3"/></svg>';
const IC_MAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
const IC_USERS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.2a3.2 3.2 0 0 1 0 6M18 20a5.5 5.5 0 0 0-3-5"/></svg>';
const IC_CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const IC_CK='<svg class="mi-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const IC_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>';
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDur=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m ${String(s).padStart(2,'0')}s`;};
const clock=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;};
const initials=n=>(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const money=n=>"$"+Number(n||0).toFixed(2);

let sb, state={user:null,membership:null,company:null,view:"overview",data:{}};
let RECOVERY=false;

function boot(){
  if(!window.supabase||!window.supabase.createClient){
    app.innerHTML='<div class="center-wrap"><div class="card auth-card"><div class="msg err">Couldn’t load the Supabase library. Check your connection and reload.</div></div></div>';
    return;
  }
  RECOVERY=/type=recovery/.test(location.hash);   // arrived from a password-reset email
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((e,session)=>{ state.user=session?.user||null; if(e==="PASSWORD_RECOVERY"){ RECOVERY=true; renderResetPassword(); } });
  init();
}
async function init(){
  if(RECOVERY){ renderResetPassword(); return; }
  const {data:{session}}=await sb.auth.getSession();
  state.user=session?.user||null;
  // invite token in hash? (#invite-<token>)
  const h=location.hash.replace(/^#/,"");
  if(h.startsWith("invite-")) state.pendingInvite=h.slice(7);
  if(!state.user){ renderAuth(); return; }
  await loadMembership();
}
async function loadMembership(){
  renderLoader("Loading your workspace…");
  // accept a pending invite first
  if(state.pendingInvite){
    try{ await sb.rpc("accept_invite",{p_token:state.pendingInvite}); }catch(e){}
    state.pendingInvite=null; location.hash="";
  }
  const {data:mems,error}=await sb.from("memberships")
    .select("*, companies(*)").eq("user_id",state.user.id).eq("status","active").limit(1);
  if(error){ renderAuthError(error.message); return; }
  if(!mems||!mems.length){ renderOnboarding(); return; }
  state.membership=mems[0];
  state.company=mems[0].companies;
  try{ const {data:pa}=await sb.rpc("is_platform_admin"); state.isPlatformAdmin=!!pa; }catch(e){ state.isPlatformAdmin=false; }
  renderShell();
  loadView("overview");
}

/* =================== AUTH =================== */
const EYE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function wireEye(inputId,btnId){
  const inp=document.getElementById(inputId), btn=document.getElementById(btnId); if(!inp||!btn) return;
  btn.onclick=()=>{ const show=inp.type==="password"; inp.type=show?"text":"password"; btn.innerHTML=show?EYE_OFF:EYE; btn.setAttribute("aria-label",show?"Hide password":"Show password"); inp.focus(); };
}
function renderAuth(mode){
  mode=mode||"signup";
  app.innerHTML=`<div class="center-wrap"><div class="card auth-card">
    <div class="brand-lg"><img src="mascot.png" alt="Fitma Tick" class="logo-lg"><div class="brand-name" style="font-size:22px">Fitma&nbsp;Tick</div></div>
    <p class="muted" style="margin:0 0 20px;text-align:center">Time tracking, screenshots & productivity for your team.</p>
    <div class="tabs"><button data-m="signup" class="${mode==='signup'?'on':''}">Create account</button>
      <button data-m="login" class="${mode==='login'?'on':''}">Log in</button></div>
    <div id="authmsg"></div>
    <form id="authform">
      ${mode==='signup'?`<div class="field"><label>Your name</label><input id="f_name" autocomplete="name" placeholder="Jane Perera" required></div>`:""}
      <div class="field"><label>Work email</label><input id="f_email" type="email" autocomplete="email" placeholder="you@company.com" required></div>
      <div class="field"><label>Password</label>
        <div style="position:relative"><input id="f_pass" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="At least 6 characters" minlength="6" required style="padding-right:42px">

    if(!email){ msg.innerHTML=`<div class="msg err">Type your email above first, then tap "Forgot password?".</div>`; app.querySelector("#f_email").focus(); return; }
    forgot.textContent="Sending…";
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; forgot.textContent="Forgot password?"; return; }
    msg.innerHTML=`<div class="msg ok">If an account exists for <b>${esc(email)}</b>, we've emailed a reset link. Open it to set a new password.</div>`;
    forgot.textContent="Forgot password?";
  };
  app.querySelector("#authform").onsubmit=async e=>{
    e.preventDefault();
    const btn=app.querySelector("#authbtn"); btn.disabled=true; btn.textContent="Please wait…";
    const email=app.querySelector("#f_email").value.trim(), pass=app.querySelector("#f_pass").value;

    try{
      if(mode==="signup"){
        const name=app.querySelector("#f_name").value.trim();
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
        if(error) throw error;
        if(!data.session){ msg.innerHTML=`<div class="msg ok">Account created. Check <b>${esc(email)}</b> for a confirmation link, then log in.</div>`; btn.disabled=false; btn.textContent="Create account"; return; }
        // save profile name
        await sb.from("profiles").upsert({id:data.user.id,full_name:name});
        state.user=data.user; await loadMembership();
      }else{
        const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error) throw error;
        state.user=data.user; await loadMembership();
      }
    }catch(err){
      msg.innerHTML=`<div class="msg err">${esc(err.message||"Something went wrong.")}</div>`;
      btn.disabled=false; btn.textContent=mode==="signup"?"Create account":"Log in";
    }

/* =================== OVERVIEW =================== */
function activityRing(pct){
  if(pct==null) return '<span class="muted" style="font-size:12px">—</span>';
  const col=pct>=75?'var(--good)':pct>=40?'var(--warn)':'var(--crit)';
  const r=13,circ=2*Math.PI*r,off=circ*(1-Math.max(0,Math.min(100,pct))/100);
  return `<svg width="34" height="34" viewBox="0 0 34 34" style="vertical-align:middle"><circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle cx="17" cy="17" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 17 17)"/><text x="17" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)" font-family="var(--ff)">${pct}</text></svg>`;
}
async function viewOverview(){
  const todayISO=startOfToday(), wkISO=startOfWeek();
  const lastWkISO=new Date(new Date(wkISO).getTime()-7*864e5).toISOString();
  const yISO=new Date(new Date(todayISO).getTime()-864e5).toISOString();
  const [{data:mems},{data:ents},{data:projs},{data:shots}]=await Promise.all([
    sb.from("memberships").select("user_id,role").eq("company_id",cid()).eq("status","active"),
    sb.from("time_entries").select("user_id,duration_sec,started_at").eq("company_id",cid()).gte("started_at",lastWkISO),
    sb.from("projects").select("id").eq("company_id",cid()).eq("archived",false),
    sb.from("screenshots").select("user_id,activity_pct,captured_at").eq("company_id",cid()).gte("captured_at",todayISO)
  ]);
  const pm=await profilesMap((mems||[]).map(m=>m.user_id));
  const nameOf=u=>pm[u]||(u===state.user.id?(state.user.user_metadata?.full_name||"You"):"Member");
  let secToday=0,secYest=0,secWeek=0,secLastWk=0;
  const puToday={},puWeek={},startToday={};
  (ents||[]).forEach(e=>{const s=e.duration_sec||0,st=e.started_at;
    if(st>=todayISO){secToday+=s;puToday[e.user_id]=(puToday[e.user_id]||0)+s;if(!startToday[e.user_id]||st<startToday[e.user_id])startToday[e.user_id]=st;}
    else if(st>=yISO){secYest+=s;}
    if(st>=wkISO){secWeek+=s;puWeek[e.user_id]=(puWeek[e.user_id]||0)+s;} else {secLastWk+=s;}
  });
  const act={}; (shots||[]).forEach(sh=>{if(sh.activity_pct!=null){(act[sh.user_id]=act[sh.user_id]||{s:0,n:0});act[sh.user_id].s+=sh.activity_pct;act[sh.user_id].n++;}});
  const actOf=u=>act[u]?Math.round(act[u].s/act[u].n):null;
  const activeToday=Object.keys(puToday).length;
  const delta=(a,b)=>{if(!b)return "";const p=Math.round((a-b)/b*100);return (p>=0?"↑":"↓")+Math.abs(p)+"% vs ";};
  const members=(mems||[]).slice().sort((a,b)=>(puToday[b.user_id]||0)-(puToday[a.user_id]||0));
  const maxWk=Math.max(1,...Object.values(puWeek),1);
  const c=content();
  c.innerHTML=`
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
     <div class="card stat"><div class="k">Tracked today</div><div class="v tnum">${fmtDur(secToday)}</div><div class="sub">${delta(secToday,secYest)}${fmtDur(secYest)} yesterday</div></div>
     <div class="card stat"><div class="k">This week</div><div class="v tnum">${fmtDur(secWeek)}</div><div class="sub">${delta(secWeek,secLastWk)}${fmtDur(secLastWk)} last week</div></div>
     <div class="card stat"><div class="k">Tracking today</div><div class="v tnum">${activeToday}<span style="font-size:15px;color:var(--faint)"> / ${mems?.length||0}</span></div><div class="sub">people active</div></div>
     <div class="card stat"><div class="k">Active projects</div><div class="v tnum">${projs?.length||0}</div><div class="sub">not archived</div></div>
   </div>
   <div class="card">
     <div class="sec-head" style="padding:16px 18px 10px"><h3>Today's activity</h3><span class="pill muted">${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span></div>
     ${members.length?`<table><thead><tr><th>Member</th><th>Role</th><th>Started</th><th style="text-align:center">Activity</th><th class="tnum" style="text-align:right">Tracked</th></tr></thead><tbody>
       ${members.map(m=>{const u=m.user_id;const nm=nameOf(u);const st=startToday[u];const tracked=puToday[u]||0;
         return `<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar" style="width:28px;height:28px;font-size:11px">${esc(initials(nm))}</div>${esc(nm)}</div></td>
           <td><span class="pill ${["owner","admin"].includes(m.role)?'accent':'muted'}">${esc(m.role)}</span></td>
           <td class="tnum">${st?new Date(st).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'<span class="muted">—</span>'}</td>
           <td style="text-align:center">${activityRing(actOf(u))}</td>
           <td class="tnum" style="text-align:right;font-weight:600">${tracked?fmtDur(tracked):'<span class="muted">—</span>'}</td></tr>`;}).join("")}
     </tbody></table>`:`<div class="empty">No members yet.</div>`}
   </div>
   <div class="card">
     <div class="sec-head" style="padding:16px 18px 10px"><h3>This week by member</h3><span class="pill muted">Mon–today</span></div>
     ${members.length?`<table><thead><tr><th>Member</th><th style="width:45%">Tracked</th><th class="tnum" style="text-align:right">Hours</th></tr></thead><tbody>
       ${members.slice().sort((a,b)=>(puWeek[b.user_id]||0)-(puWeek[a.user_id]||0)).map(m=>{const s=puWeek[m.user_id]||0;const nm=nameOf(m.user_id);
         return `<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar" style="width:26px;height:26px;font-size:11px">${esc(initials(nm))}</div>${esc(nm)}</div></td>
           <td><div class="bar"><i style="width:${Math.round(s/maxWk*100)}%"></i></div></td>
           <td class="tnum" style="text-align:right;font-weight:600">${fmtDur(s)}</td></tr>`;}).join("")}
     </tbody></table>`:""}
   </div>`;
}

function renderEntries(entries,pmap){

      <td>${e.project_id?esc(pmap[e.project_id]||"Project"):'<span class="muted">—</span>'}</td>

      <td><span class="pill muted"${e.note?` title="${esc(e.note)}"`:''}>${esc(e.source)}</span>${e.note?` <span class="muted" style="font-size:12px">· ${esc(e.note)}</span>`:''}</td>
      <td style="text-align:right"><button class="btn ghost sm" data-del="${e.id}">Delete</button></td></tr>`;}).join("")}

function startClock(){clearInterval(timer.tick);timer.tick=setInterval(()=>{const el=document.getElementById("tclock");if(el)el.textContent=clock((Date.now()-timer.startedAt)/1000);},1000);
  const el=document.getElementById("tclock");if(el)el.textContent=clock((Date.now()-timer.startedAt)/1000);}
async function startTimer(){
  const sel=content().querySelector("#tproj");timer.projectId=sel.value||null;
  timer.startedAt=Date.now();timer.running=true;
  const {data,error}=await sb.from("time_entries").insert({company_id:cid(),user_id:state.user.id,project_id:timer.projectId,started_at:new Date(timer.startedAt).toISOString(),source:"desktop"}).select().single();
  if(error){alert2(error.message);timer.running=false;return;}
  timer.entryId=data.id;sel.disabled=true;
  content().querySelector("#tdot").classList.add("live");
  const btn=content().querySelector("#tbtn");btn.textContent="Stop";btn.classList.remove("pri");btn.classList.add("danger");
  startClock();
}
async function stopTimer(){
  clearInterval(timer.tick);timer.running=false;
  const ended=new Date(),dur=Math.round((Date.now()-timer.startedAt)/1000);
  if(timer.entryId) await sb.from("time_entries").update({ended_at:ended.toISOString(),duration_sec:dur}).eq("id",timer.entryId);
  timer.entryId=null;loadView("timesheet");
}
function manualEntry(projs){
  const mgr=isMgr();
  showModal(`<h3 style="margin-bottom:4px">Add time manually</h3>
    <p class="muted" style="margin:0 0 14px">${mgr?'Added straight to your timesheet.':'Sent to a manager for approval before it counts.'}</p>
    <div id="m_msg"></div>
    <div class="field"><label>Project</label><select id="m_proj"><option value="">No project</option>${projs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
    <div class="row"><div class="field" style="flex:1"><label>Date</label><input id="m_date" type="date" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field" style="flex:1"><label>Hours</label><input id="m_h" type="number" min="0" max="24" value="1"></div>
      <div class="field" style="flex:1"><label>Minutes</label><input id="m_m" type="number" min="0" max="59" value="0"></div></div>
    <div class="field"><label>Reason${mgr?' (optional)':''}</label><input id="m_note" placeholder="e.g. Client call not tracked on the timer"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn" onclick="window._closeModal()">Cancel</button>
      <button class="btn pri" id="m_save">${mgr?'Add entry':'Send for approval'}</button></div>`);
  document.getElementById("m_save").onclick=async()=>{
    const date=document.getElementById("m_date").value;
    const dur=(+document.getElementById("m_h").value*3600)+(+document.getElementById("m_m").value*60);
    const note=document.getElementById("m_note").value.trim()||null;
    if(!date||dur<=0){document.getElementById("m_msg").innerHTML=`<div class="msg err">Enter a date and a duration.</div>`;return;}
    if(!mgr&&!note){document.getElementById("m_msg").innerHTML=`<div class="msg err">Add a short reason so your manager can approve it.</div>`;return;}
    const proj=document.getElementById("m_proj").value||null;
    const btn=document.getElementById("m_save");btn.disabled=true;btn.textContent="Saving…";
    let error;
    if(mgr){
      const start=new Date(date+"T09:00:00");
      ({error}=await sb.from("time_entries").insert({company_id:cid(),user_id:state.user.id,project_id:proj,started_at:start.toISOString(),ended_at:new Date(start.getTime()+dur*1000).toISOString(),duration_sec:dur,source:"manual",note}));
    }else{
      ({error}=await sb.from("manual_time_requests").insert({company_id:cid(),user_id:state.user.id,project_id:proj,work_date:date,duration_sec:dur,note}));
    }
    if(error){btn.disabled=false;btn.textContent=mgr?'Add entry':'Send for approval';document.getElementById("m_msg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return;}
    _closeModal();loadView("timesheet");
  };
}

      <div class="sec-head"><div style="display:flex;align-items:center;gap:9px">
        <span style="width:11px;height:11px;border-radius:3px;background:${p.color||'var(--primary)'}"></span>

function projectAssignModal(p,members,current,nameOf){

    </div>`);
  const chks=()=>Array.from(document.querySelectorAll(".pa_chk"));
  document.getElementById("pa_all").onclick=()=>{const all=chks().every(c=>c.checked);chks().forEach(c=>c.checked=!all);document.getElementById("pa_all").textContent=all?"Select all":"Clear all";};
  document.getElementById("pa_save").onclick=async()=>{
    const want=new Set(chks().filter(c=>c.checked).map(c=>c.value));

    _closeModal();loadView("projects");
  };

let shotsState={date:null,user:"all"};
async function viewShots(){
  const c=content();
  if(!shotsState.date) shotsState.date=dkey(new Date());
  const day=shotsState.date;
  const from=new Date(day+"T00:00:00"), to=new Date(from.getTime()+864e5);
  const {data:mems}=await sb.from("memberships").select("user_id,role").eq("company_id",cid()).eq("status","active");
  const pm=await profilesMap((mems||[]).map(m=>m.user_id));
  const nameOf=u=>pm[u]||(u===state.user.id?"You":"Member");
  let q=sb.from("screenshots").select("id,user_id,captured_at,storage_path,thumb_path,activity_pct,blurred").eq("company_id",cid()).gte("captured_at",from.toISOString()).lt("captured_at",to.toISOString()).order("captured_at",{ascending:false}).limit(240);
  if(shotsState.user!=="all") q=q.eq("user_id",shotsState.user);
  const {data:rows}=await q;
  const _acts=(rows||[]).map(r=>r.activity_pct).filter(v=>v!=null);
  const avgAct=_acts.length?Math.round(_acts.reduce((a,b)=>a+b,0)/_acts.length):null;
  const actPill=a=>a==null?'muted':a>=75?'good':a>=40?'warn':'muted';
  const urlMap={}; const paths=(rows||[]).map(r=>r.thumb_path||r.storage_path).filter(Boolean);
  if(paths.length){ try{ const {data:signed}=await sb.storage.from("screenshots").createSignedUrls(paths,3600); (signed||[]).forEach(s=>{if(s&&s.signedUrl)urlMap[s.path]=s.signedUrl;}); }catch(e){} }
  const prettyDay=from.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  const isToday=day===dkey(new Date());
  c.innerHTML=`
   <div class="card" style="padding:12px 16px">
     <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
       <button class="btn sm" id="pday">‹</button>
       <input type="date" id="sday" value="${day}" max="${dkey(new Date())}" style="padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg)">
       <button class="btn sm" id="nday" ${isToday?'disabled':''}>›</button>
       <span class="muted" style="font-size:13px">${prettyDay}</span>
       ${isMgr()?`<select id="suser" style="margin-left:auto;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg)"><option value="all">All members</option>${(mems||[]).map(m=>`<option value="${m.user_id}" ${shotsState.user===m.user_id?'selected':''}>${esc(nameOf(m.user_id))}</option>`).join("")}</select>`:''}
       <span class="pill ${actPill(avgAct)}"${isMgr()?'':' style="margin-left:auto"'} title="Average activity across these shots">Avg activity ${avgAct==null?'—':avgAct+'%'}</span>
       <span class="pill muted">${(rows||[]).length} shot(s)</span>
     </div>
   </div>
   ${(rows||[]).length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
     ${rows.map(s=>{const u=urlMap[s.thumb_path||s.storage_path]||"";return `<div class="card" style="overflow:hidden;cursor:pointer" data-shot="${esc(u)}" data-meta="${esc(nameOf(s.user_id)+' · '+new Date(s.captured_at).toLocaleString()+(s.activity_pct!=null?' · '+s.activity_pct+'% activity':''))}">
       <div style="aspect-ratio:16/10;background:var(--surface-2);background-size:cover;background-position:center top;${u?`background-image:url('${u}')`:''}"></div>
       <div style="padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px">
         <div style="min-width:0"><div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nameOf(s.user_id))}</div>
           <div class="muted" style="font-size:11px">${new Date(s.captured_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>
         <span class="pill ${s.activity_pct>=75?'good':s.activity_pct>=40?'warn':'muted'}" style="flex:none">${s.activity_pct==null?'—':s.activity_pct+'%'}</span>
       </div></div>`;}).join("")}
   </div>`:`<div class="card"><div class="empty">${ICON.shots}<div><b>No screenshots on ${prettyDay}.</b></div>
     <p class="hint" style="max-width:440px;margin:8px auto 0">Screenshots are captured automatically by the Fitma Tick desktop app while the timer runs. Pick another day, or install the app on a member's computer.</p></div></div>`}`;
  const setDay=d=>{shotsState.date=d;viewShots();};
  c.querySelector("#sday").onchange=e=>setDay(e.target.value);
  c.querySelector("#pday").onclick=()=>setDay(dkey(new Date(from.getTime()-864e5)));
  const nb=c.querySelector("#nday"); if(nb&&!nb.disabled) nb.onclick=()=>setDay(dkey(new Date(from.getTime()+864e5)));
  const su=c.querySelector("#suser"); if(su) su.onchange=e=>{shotsState.user=e.target.value;viewShots();};
  enhanceSelects(c);
  c.querySelectorAll("[data-shot]").forEach(el=>el.onclick=()=>{const u=el.dataset.shot;if(!u)return;
    showModal(`<img src="${esc(u)}" style="width:100%;border-radius:10px;display:block"><div class="muted" style="font-size:13px;margin-top:8px">${esc(el.dataset.meta||'')}</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="window._closeModal()">Close</button></div>`);
    const mm=document.querySelector(".modal"); if(mm) mm.style.maxWidth="860px";});
}

async function subscribeFlow(planCode,price,seats){

  showModal(`<h3 style="margin-bottom:4px">Subscribe to ${plan.name}</h3>
    <p class="muted" style="margin:0 0 16px">${money(price)} / member / month, billed annually.</p>

    const num="FT-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
    const instructions={method:"bank_transfer",note:"Pay the total to the account below and email the receipt. Access unlocks once payment is confirmed.",beneficiary:"Fitma (Pvt) Ltd",bank:"Amana Bank",reference:num};
    const {data,error}=await sb.from("invoices").insert({company_id:cid(),number:num,amount_usd:annual,status:"pending",due_at:new Date(Date.now()+14*864e5).toISOString(),instructions}).select().single();

let _popOnClose=null;
function closePop(){document.querySelectorAll(".menu-pop").forEach(x=>x.remove());if(_popOnClose){const f=_popOnClose;_popOnClose=null;try{f();}catch(e){}}}
function popMenu(btn,items,opts){
  opts=opts||{};
  closePop();
  const r=btn.getBoundingClientRect();
  const m=document.createElement("div");m.className="menu-pop";
  if(opts.minWidth) m.style.minWidth=opts.minWidth+"px";
  m.innerHTML=items.map((it,i)=>it==="sep"?'<div class="menu-sep"></div>':`<button class="menu-item${it.danger?' danger':''}${it.selected?' sel':''}" data-i="${i}">${it.icon||""}<span>${esc(it.label)}</span>${it.selected?IC_CK:""}</button>`).join("");
  document.body.appendChild(m);
  // horizontal: align left under the trigger for selects, right-anchored for row menus (default)
  let left=(opts.align==="left")?(r.left+window.scrollX):(r.right-m.offsetWidth+window.scrollX);
  if(left+m.offsetWidth>window.innerWidth-8) left=window.innerWidth-8-m.offsetWidth;
  if(left<8)left=8;
  let top=r.bottom+5+window.scrollY;
  if(r.bottom+m.offsetHeight>window.innerHeight-8 && r.top>m.offsetHeight) top=r.top-m.offsetHeight-5+window.scrollY;
  m.style.left=left+"px";m.style.top=top+"px";
  // keep the selected row in view when the list scrolls
  const selEl=m.querySelector(".menu-item.sel"); if(selEl&&m.scrollHeight>m.clientHeight) selEl.scrollIntoView({block:"nearest"});
  _popOnClose=opts.onClose||null;
  m.querySelectorAll(".menu-item").forEach(b=>b.onclick=ev=>{ev.stopPropagation();closePop();const it=items[+b.dataset.i];if(it&&it.on)it.on();});
  setTimeout(()=>document.addEventListener("click",closePop,{once:true}),0);
}

// Replace a native <select> with a styled trigger that opens a themed menu (the native select stays as the value holder).
function enhanceSelect(sel){
  if(!sel||sel._enh||sel.dataset.native!=null) return; sel._enh=true;
  const trig=document.createElement("button"); trig.type="button";
  trig.className="csel"+((sel.parentElement&&sel.parentElement.classList.contains("field"))?" csel-block":"");
  trig.innerHTML='<span></span>'+IC_CHEV;
  const label=trig.querySelector("span");
  const sync=()=>{const o=sel.options[sel.selectedIndex];label.textContent=o?o.textContent:"";trig.classList.toggle("disabled",!!sel.disabled);};
  // carry over positioning the select relied on (e.g. margin-left:auto to push right)
  if(sel.style.marginLeft)trig.style.marginLeft=sel.style.marginLeft;
  if(sel.style.marginRight)trig.style.marginRight=sel.style.marginRight;
  sel.style.display="none"; sel.parentNode.insertBefore(trig,sel.nextSibling); sync(); sel._cselSync=sync;
  trig.onclick=ev=>{ if(sel.disabled) return; ev.stopPropagation();
    trig.classList.add("open");
    const items=Array.from(sel.options).map((o,i)=>({label:o.textContent,selected:i===sel.selectedIndex,on:()=>{sel.selectedIndex=i;sync();sel.dispatchEvent(new Event("change",{bubbles:true}));}}));

       <div class="card stat"><div class="k">Avg / person</div><div class="v tnum">${fmtDur(urows.length?total/urows.length:0)}</div><div class="sub">across the team</div></div>
     </div>
     <div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>${primary.title}</h3></div>${tableFor(primary,true)}</div>
     <div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>${secondary.title}</h3></div>${tableFor(secondary,false)}</div>`;
    return;
  }

  if(reportsState.tab==="timesheet"){
    const days=daysBetween(from,to);
    const grid={}; members.forEach(u=>grid[u]={});
    E.forEach(e=>{const dk=dkey(new Date(e.started_at));const u=e.user_id;grid[u]=grid[u]||{};grid[u][dk]=(grid[u][dk]||0)+(e.duration_sec||0);});
    const dayCols=days.slice(-14); // cap visible columns; CSV has all
    _reportExport={name:`timesheet-${dkey(from)}.csv`,title:`Timesheet — ${rangeLabel}`,sub:`${days.length} day(s)`,rows:[["Member"].concat(days.map(d=>dkey(d))).concat(["Total"])].concat(
      members.map(u=>[nameOf(u)].concat(days.map(d=>hrs((grid[u]||{})[dkey(d)]||0).toFixed(2))).concat([hrs(days.reduce((s,d)=>s+((grid[u]||{})[dkey(d)]||0),0)).toFixed(2)])))};
    body.innerHTML=`<div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>Timesheet</h3><span class="muted" style="font-size:13px">${rangeLabel}${days.length>14?' · last 14 days shown, CSV has all':''}</span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Member</th>${dayCols.map(d=>`<th class="tnum" style="text-align:right">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</th>`).join("")}<th class="tnum" style="text-align:right">Total</th></tr></thead><tbody>
      ${members.map(u=>{const tot=days.reduce((s,d)=>s+((grid[u]||{})[dkey(d)]||0),0);return `<tr><td style="font-weight:600;white-space:nowrap">${esc(nameOf(u))}</td>${dayCols.map(d=>{const v=(grid[u]||{})[dkey(d)]||0;return `<td class="tnum" style="text-align:right;${v?'':'color:var(--faint)'}">${v?hrs(v).toFixed(1):'—'}</td>`;}).join("")}<td class="tnum" style="text-align:right;font-weight:700">${hrs(tot).toFixed(1)}</td></tr>`;}).join("")}
      </tbody></table></div></div>`;
    return;
  }

  if(reportsState.tab==="attendance"){
    // per member per day: first start, last end, total
    const att={}; members.forEach(u=>att[u]={});
    E.forEach(e=>{const u=e.user_id;const st=new Date(e.started_at);const dk=dkey(st);att[u]=att[u]||{};const cell=att[u][dk]||{first:null,last:null,sec:0};
      if(!cell.first||st<cell.first)cell.first=st;const en=e.ended_at?new Date(e.ended_at):st;if(!cell.last||en>cell.last)cell.last=en;cell.sec+=(e.duration_sec||0);att[u][dk]=cell;});
    const days=daysBetween(from,to);
    const summary=members.map(u=>{const ds=Object.values(att[u]||{});const present=ds.length;const totSec=ds.reduce((s,x)=>s+x.sec,0);
      const starts=ds.map(x=>x.first.getHours()*60+x.first.getMinutes()).filter(x=>x!=null);const avgStart=starts.length?Math.round(starts.reduce((a,b)=>a+b,0)/starts.length):null;
      return {u,present,totSec,avgStart};}).sort((a,b)=>b.present-a.present);
    const hhmm=m=>m==null?"—":String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    _reportExport={name:`attendance-${dkey(from)}.csv`,title:`Attendance — ${rangeLabel}`,sub:`${days.length} day(s)`,rows:[["Member","Days present","Avg start","Total hours"]].concat(summary.map(r=>[nameOf(r.u),r.present,hhmm(r.avgStart),hrs(r.totSec).toFixed(2)]))};
    body.innerHTML=`<div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>Attendance</h3><span class="muted" style="font-size:13px">${rangeLabel} · ${days.length} day(s)</span></div>
      <table><thead><tr><th>Member</th><th class="tnum" style="text-align:right">Days present</th><th class="tnum" style="text-align:right">Avg start</th><th class="tnum" style="text-align:right">Total hours</th></tr></thead><tbody>
      ${summary.map(r=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar" style="width:26px;height:26px;font-size:11px">${esc(initials(nameOf(r.u)))}</div>${esc(nameOf(r.u))}</div></td>
        <td class="tnum" style="text-align:right">${r.present}</td><td class="tnum" style="text-align:right">${hhmm(r.avgStart)}</td><td class="tnum" style="text-align:right;font-weight:600">${fmtDur(r.totSec)}</td></tr>`).join("")}
      </tbody></table><p class="hint" style="padding:10px 18px">Start-time rules (on-time vs late) arrive with company work-schedule settings, so no one is ever marked late by mistake.</p></div>`;
    return;
  }
}

/* =================== FINANCES (invoices · payments · payroll) =================== */
let financeState={tab:"invoices"};
const todayISODate=()=>new Date().toISOString().slice(0,10);
const addDaysISO=(n)=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const invStatusPill=s=>({draft:'muted',sent:'warn',paid:'good',void:'muted'})[s]||'muted';

async function viewFinances(){
  const c=content();
  const tabs=[["invoices","Invoices"],["payments","Payments"],["payroll","Payroll"]];
  const actions={invoices:["+ New invoice","newInvoice"],payments:["+ Record payment","newPayment"],payroll:["+ New payroll run","newPayroll"]};
  app.querySelector("#topright").innerHTML=`<button class="btn pri sm" id="finact">${actions[financeState.tab][0]}</button>`;
  c.innerHTML=`
   <div class="card" style="padding:12px 16px">
     <div class="tabs" style="margin:0;flex-wrap:wrap">${tabs.map(([k,l])=>`<button data-ft="${k}" class="${financeState.tab===k?'on':''}">${l}</button>`).join("")}</div>
   </div>
   <div id="fbody"><div class="loader" style="min-height:160px"><div class="spin"></div></div></div>`;
  c.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{financeState.tab=b.dataset.ft;viewFinances();});
  const act=app.querySelector("#finact");
  act.onclick=()=>window[actions[financeState.tab][1]]();
  const body=c.querySelector("#fbody");
  if(financeState.tab==="invoices") await finInvoices(body);
  else if(financeState.tab==="payments") await finPayments(body);
  else await finPayroll(body);
}

/* ---------- Invoices ---------- */
async function finInvoices(body){
  const [{data:invs},{data:pays}]=await Promise.all([
    sb.from("client_invoices").select("*").eq("company_id",cid()).order("issued_on",{ascending:false}),
    sb.from("client_payments").select("invoice_id,amount").eq("company_id",cid())
  ]);
  const paidByInv={}; (pays||[]).forEach(p=>{if(p.invoice_id)paidByInv[p.invoice_id]=(paidByInv[p.invoice_id]||0)+Number(p.amount||0);});
  const list=invs||[];
  const outstanding=list.filter(i=>i.status!=='paid'&&i.status!=='void').reduce((s,i)=>s+Math.max(0,Number(i.total||0)-(paidByInv[i.id]||0)),0);
  const thisMonth=new Date(); const paidThisMonth=list.filter(i=>i.status==='paid'&&i.paid_on&&new Date(i.paid_on).getMonth()===thisMonth.getMonth()&&new Date(i.paid_on).getFullYear()===thisMonth.getFullYear()).reduce((s,i)=>s+Number(i.total||0),0);
  const drafts=list.filter(i=>i.status==='draft').length;
  body.innerHTML=`
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">

     <div class="card stat"><div class="k">Paid this month</div><div class="v tnum">${money(paidThisMonth)}</div><div class="sub">${thisMonth.toLocaleDateString(undefined,{month:'long'})}</div></div>
     <div class="card stat"><div class="k">Drafts</div><div class="v tnum">${drafts}</div><div class="sub">not sent yet</div></div>
   </div>
   <div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>Invoices</h3><span class="pill muted">${list.length}</span></div>
   ${list.length?`<div style="overflow-x:auto"><table><thead><tr><th>Invoice</th><th>Client</th><th>Issued</th><th>Due</th><th class="tnum" style="text-align:right">Total</th><th>Status</th><th></th></tr></thead><tbody>
     ${list.map(i=>{const paid=paidByInv[i.id]||0;const part=paid>0&&paid<Number(i.total||0)&&i.status!=='paid';
       return `<tr><td class="tnum" style="font-weight:600">${esc(i.number)}</td><td>${esc(i.client_name)}</td><td>${fmtDate(i.issued_on)}</td>
       <td>${i.due_on?fmtDate(i.due_on):'—'}</td><td class="tnum" style="text-align:right;font-weight:600">${money(i.total)}</td>
       <td><span class="pill ${invStatusPill(i.status)}">${esc(i.status)}</span>${part?' <span class="pill muted" style="font-size:11px">part-paid</span>':''}</td>
       <td style="text-align:right"><button class="btn ghost sm" data-inv="${i.id}">Open</button></td></tr>`;}).join("")}
     </tbody></table></div>`:`<div class="empty">${ICON.billing}<div>No invoices yet. Create one from tracked time or line items.</div></div>`}</div>`;
  body.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>openInvoice(b.dataset.inv));
}

      <div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">Tax</span><span class="tnum" id="iv_taxv" style="font-weight:600">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0 0;border-top:1px solid var(--border);margin-top:4px"><span style="font-weight:600">Total</span><span class="tnum" id="iv_total" style="font-weight:700;font-family:var(--fh)">$0.00</span></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="window._closeModal()">Cancel</button><button class="btn pri" id="iv_save">Create invoice</button></div>`);

function renderInvItems(){
  const wrap=document.getElementById("iv_items");
  wrap.innerHTML=_invItems.map((it,idx)=>`<div class="row" style="gap:8px;align-items:flex-end;margin-bottom:6px">
     <div class="field" style="flex:1;min-width:120px;margin:0"><input data-ii-desc="${idx}" placeholder="Description" value="${esc(it.description||'')}"></div>
     <div class="field" style="width:76px;margin:0"><input data-ii-qty="${idx}" type="number" step="0.01" min="0" value="${it.qty??1}" title="Qty / hours"></div>
     <div class="field" style="width:90px;margin:0"><input data-ii-rate="${idx}" type="number" step="0.01" min="0" value="${it.rate??0}" title="Rate"></div>
     <div class="tnum" style="width:84px;text-align:right;font-weight:600;padding-bottom:9px" data-ii-amt="${idx}">${money((it.qty||0)*(it.rate||0))}</div>
     <button class="btn ghost sm" type="button" data-ii-del="${idx}" style="padding:7px 9px">✕</button>
   </div>`).join("");
  wrap.querySelectorAll("[data-ii-desc]").forEach(el=>el.oninput=e=>{_invItems[+e.target.dataset.iiDesc].description=e.target.value;});
  wrap.querySelectorAll("[data-ii-qty]").forEach(el=>el.oninput=e=>{_invItems[+e.target.dataset.iiQty].qty=parseFloat(e.target.value)||0;recalcInv();});
  wrap.querySelectorAll("[data-ii-rate]").forEach(el=>el.oninput=e=>{_invItems[+e.target.dataset.iiRate].rate=parseFloat(e.target.value)||0;recalcInv();});
  wrap.querySelectorAll("[data-ii-del]").forEach(el=>el.onclick=e=>{_invItems.splice(+e.target.dataset.iiDel,1);if(!_invItems.length)_invItems.push({description:"",qty:1,rate:0});renderInvItems();});
  recalcInv();
}
function recalcInv(){
  let sub=0;_invItems.forEach((it,idx)=>{const a=(it.qty||0)*(it.rate||0);sub+=a;const el=document.querySelector(`[data-ii-amt="${idx}"]`);if(el)el.textContent=money(a);});
  const tax=(parseFloat(document.getElementById("iv_tax").value)||0)/100*sub;
  document.getElementById("iv_sub").textContent=money(sub);
  document.getElementById("iv_taxv").textContent=money(tax);
  document.getElementById("iv_total").textContent=money(sub+tax);
}
async function addInvoiceFromTime(projs){
  const pid=document.getElementById("iv_proj").value;
  const proj=projs.find(p=>p.id===pid);
  // sum tracked hours for this project (or whole company if none) over last 30 days
  const from=new Date();from.setDate(from.getDate()-30);from.setHours(0,0,0,0);
  let q=sb.from("time_entries").select("duration_sec,project_id").eq("company_id",cid()).gte("started_at",from.toISOString());
  const {data:ents}=await q;
  const sec=(ents||[]).filter(e=>pid?e.project_id===pid:true).reduce((s,e)=>s+(e.duration_sec||0),0);
  const hours=Math.round(hrs(sec)*100)/100;
  if(hours<=0){const m=document.getElementById("invmsg");m.innerHTML=`<div class="msg err">No tracked time in the last 30 days${pid?' for this project':''} yet.</div>`;return;}
  const rate=proj&&proj.bill_rate?Number(proj.bill_rate):0;
  const label=(proj?proj.name:"Tracked work")+" — last 30 days";
  if(_invItems.length===1&&!_invItems[0].description&&!_invItems[0].rate)_invItems=[];
  _invItems.push({description:label,qty:hours,rate:rate});
  renderInvItems();
  if(!rate){const m=document.getElementById("invmsg");m.innerHTML=`<div class="msg" style="background:var(--warn-soft);color:var(--warn)">Added ${hours}h. Set a rate — tip: add a billable rate to the project so it fills in automatically.</div>`;}
}
async function saveInvoice(){
  const client=document.getElementById("iv_client").value.trim();
  if(!client){document.getElementById("invmsg").innerHTML=`<div class="msg err">Enter a client name.</div>`;return;}
  const items=_invItems.filter(it=>(it.description||"").trim()||it.qty||it.rate).map((it,i)=>({description:(it.description||"Item").trim(),qty:it.qty||0,rate:it.rate||0,amount:Math.round((it.qty||0)*(it.rate||0)*100)/100,sort:i}));
  if(!items.length){document.getElementById("invmsg").innerHTML=`<div class="msg err">Add at least one line item.</div>`;return;}
  const subtotal=items.reduce((s,it)=>s+it.amount,0);
  const taxPct=parseFloat(document.getElementById("iv_tax").value)||0;
  const total=Math.round((subtotal*(1+taxPct/100))*100)/100;
  const {count}=await sb.from("client_invoices").select("*",{count:"exact",head:true}).eq("company_id",cid());
  const number="INV-"+new Date().getFullYear()+"-"+String((count||0)+1).padStart(4,"0");
  const btn=document.getElementById("iv_save");btn.disabled=true;btn.textContent="Creating…";
  const {data:inv,error}=await sb.from("client_invoices").insert({
    company_id:cid(),number,client_name:client,project_id:document.getElementById("iv_proj").value||null,
    status:"draft",issued_on:document.getElementById("iv_issue").value||todayISODate(),due_on:document.getElementById("iv_due").value||null,
    subtotal,tax_pct:taxPct,total,notes:document.getElementById("iv_notes").value.trim()||null,created_by:state.user.id
  }).select().single();
  if(error){btn.disabled=false;btn.textContent="Create invoice";document.getElementById("invmsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return;}
  const rows=items.map(it=>({...it,company_id:cid(),invoice_id:inv.id}));
  await sb.from("client_invoice_items").insert(rows);
  _closeModal();loadView("finance");setTimeout(()=>openInvoice(inv.id),120);
}
async function openInvoice(id){

  showModal(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">

    </tbody></table></div>
    <div class="card" style="padding:12px 14px;background:var(--surface-2);box-shadow:none;margin-top:10px">
      <div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">Subtotal</span><span class="tnum">${money(i.subtotal)}</span></div>
      ${Number(i.tax_pct)?`<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="muted">Tax (${Number(i.tax_pct)}%)</span><span class="tnum">${money(Number(i.total)-Number(i.subtotal))}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;padding:6px 0 0;border-top:1px solid var(--border);margin-top:4px"><span style="font-weight:600">Total</span><span class="tnum" style="font-weight:700">${money(i.total)}</span></div>
      ${paid?`<div style="display:flex;justify-content:space-between;padding:4px 0 0"><span class="muted">Paid</span><span class="tnum" style="color:var(--good)">−${money(paid)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:2px 0"><span style="font-weight:600">Balance due</span><span class="tnum" style="font-weight:700">${money(bal)}</span></div>`:''}
    </div>
    ${i.notes?`<p class="hint" style="margin-top:8px">${esc(i.notes)}</p>`:''}
    <div class="row" style="justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px">
      <button class="btn ghost sm" id="iv_del">Delete</button>
      <div class="row" style="gap:8px">
        ${i.status==='draft'?`<button class="btn sm" id="iv_send">Mark as sent</button>`:''}
        ${i.status!=='paid'&&i.status!=='void'?`<button class="btn sm" id="iv_pay">Record payment</button>`:''}
        ${i.status!=='paid'&&i.status!=='void'?`<button class="btn acc sm" id="iv_markpaid">Mark fully paid</button>`:''}
        <button class="btn" onclick="window._closeModal()">Close</button>
      </div></div>`);
  const on=(id2,fn)=>{const el=document.getElementById(id2);if(el)el.onclick=fn;};
  on("iv_send",async()=>{await sb.from("client_invoices").update({status:"sent"}).eq("id",i.id);_closeModal();loadView("finance");});

async function newPayroll(){
  const now=new Date();
  const mStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  const mEnd=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);
  showModal(`<h3 style="margin-bottom:4px">New payroll run</h3>
    <p class="muted" style="margin:0 0 14px">Pick a period — we'll pull each member's tracked hours and pay rate.</p>
    <div id="prmsg"></div>
    <div class="row" style="gap:10px;flex-wrap:wrap">
      <div class="field" style="flex:1;min-width:130px"><label>Period start</label><input id="pr_start" type="date" value="${mStart}"></div>
      <div class="field" style="flex:1;min-width:130px"><label>Period end</label><input id="pr_end" type="date" value="${mEnd}"></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="window._closeModal()">Cancel</button><button class="btn pri" id="pr_gen">Generate</button></div>`);
  document.getElementById("pr_gen").onclick=async()=>{
    const start=document.getElementById("pr_start").value,end=document.getElementById("pr_end").value;
    if(!start||!end){document.getElementById("prmsg").innerHTML=`<div class="msg err">Pick both dates.</div>`;return;}
    const btn=document.getElementById("pr_gen");btn.disabled=true;btn.textContent="Generating…";
    const fromISO=new Date(start+"T00:00:00").toISOString();
    const toISO=new Date(end+"T23:59:59").toISOString();
    const [{data:mems},{data:ents}]=await Promise.all([
      sb.from("memberships").select("user_id,hourly_rate,pay_type,monthly_pay").eq("company_id",cid()).eq("status","active"),
      sb.from("time_entries").select("user_id,duration_sec").eq("company_id",cid()).gte("started_at",fromISO).lte("started_at",toISO)
    ]);
    const secBy={};(ents||[]).forEach(e=>{secBy[e.user_id]=(secBy[e.user_id]||0)+(e.duration_sec||0);});
    const items=(mems||[]).map(m=>{const fixed=m.pay_type==='fixed';const hours=Math.round(hrs(secBy[m.user_id]||0)*100)/100;
      const rate=Number(m.hourly_rate||0);const gross=fixed?Number(m.monthly_pay||0):Math.round(hours*rate*100)/100;
      return {user_id:m.user_id,pay_type:fixed?'fixed':'hourly',hours,rate,gross};});
    const total=items.reduce((s,it)=>s+it.gross,0);
    const {data:run,error}=await sb.from("payroll_runs").insert({company_id:cid(),period_start:start,period_end:end,status:"draft",total,created_by:state.user.id}).select().single();
    if(error){btn.disabled=false;btn.textContent="Generate";document.getElementById("prmsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return;}
    await sb.from("payroll_items").insert(items.map(it=>({...it,company_id:cid(),run_id:run.id})));
    _closeModal();loadView("finance");setTimeout(()=>openPayrollRun(run.id),120);
  };
}

      <div class="field" style="flex:1;min-width:130px"><label>From</label><input id="to_start" type="date" value="${todayISODate()}"></div>
      <div class="field" style="flex:1;min-width:130px"><label>To</label><input id="to_end" type="date" value="${todayISODate()}"></div>
      <div class="field" style="width:90px"><label>Days</label><input id="to_days" type="number" step="0.5" min="0.5" value="1"></div>
    </div>
    <div class="field"><label>Reason (optional)</label><input id="to_reason" placeholder="e.g. family trip"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="window._closeModal()">Cancel</button><button class="btn pri" id="to_save">Submit request</button></div>`);
  const recalc=()=>{const s=document.getElementById("to_start").value,e=document.getElementById("to_end").value;if(s&&e&&e>=s)document.getElementById("to_days").value=daysInclusive(s,e);};
  document.getElementById("to_start").onchange=recalc;document.getElementById("to_end").onchange=recalc;
  document.getElementById("to_save").onclick=async()=>{
    const s=document.getElementById("to_start").value,e=document.getElementById("to_end").value;
    if(!s||!e||e<s){document.getElementById("tomsg").innerHTML=`<div class="msg err">Pick a valid date range.</div>`;return;}
    const {error}=await sb.from("time_off_requests").insert({company_id:cid(),user_id:state.user.id,type:document.getElementById("to_type").value,start_date:s,end_date:e,days:parseFloat(document.getElementById("to_days").value)||daysInclusive(s,e),reason:document.getElementById("to_reason").value.trim()||null});
    if(error){document.getElementById("tomsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return;}
    _closeModal();loadView("timeoff");
  };
}

/* =================== SHIFTS =================== */
let shiftsState={weekStart:null,member:"all"};
function weekMonday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function shiftHours(st,en){const p=t=>{const[h,m]=String(t).split(":");return (+h)+(+m)/60;};let d=p(en)-p(st);if(d<0)d+=24;return d;}
const hhmmShort=t=>String(t).slice(0,5);
async function viewShifts(){
  const c=content(); const mgr=isMgr(); const me=state.user.id;
  if(!shiftsState.weekStart) shiftsState.weekStart=weekMonday(new Date());
  const ws=new Date(shiftsState.weekStart); const we=new Date(ws);we.setDate(we.getDate()+6);we.setHours(23,59,59,999);
  if(mgr) app.querySelector("#topright").innerHTML=`<button class="btn pri sm" id="shadd">+ Add shift</button>`;
  const [{data:shifts},{data:ents},{data:mems}]=await Promise.all([
    (mgr?sb.from("shifts").select("*").eq("company_id",cid()):sb.from("shifts").select("*").eq("company_id",cid()).eq("user_id",me)).gte("shift_date",ws.toISOString().slice(0,10)).lte("shift_date",we.toISOString().slice(0,10)).order("shift_date"),
    sb.from("time_entries").select("user_id,started_at,duration_sec").eq("company_id",cid()).gte("started_at",ws.toISOString()).lte("started_at",we.toISOString()),
    sb.from("memberships").select("user_id").eq("company_id",cid()).eq("status","active")
  ]);
  const pm=await profilesMap((mems||[]).map(m=>m.user_id).concat((shifts||[]).map(s=>s.user_id)));
  const nameOf=u=>pm[u]||(u===me?(state.user.user_metadata?.full_name||"You"):"Member");
  // tracked seconds per user+date
  const trk={};(ents||[]).forEach(e=>{const k=e.user_id+"|"+dkey(new Date(e.started_at));trk[k]=(trk[k]||0)+(e.duration_sec||0);});
  if(!mgr) shiftsState.member="all";
  const shMemList=(mems||[]).map(m=>m.user_id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
  const list=(shifts||[]).filter(s=>shiftsState.member==="all"||s.user_id===shiftsState.member);
  const vents=shiftsState.member==="all"?(ents||[]):(ents||[]).filter(e=>e.user_id===shiftsState.member);
  const plannedTotal=list.reduce((s,sh)=>s+shiftHours(sh.start_time,sh.end_time),0);
  const trackedTotal=vents.reduce((s,e)=>s+(e.duration_sec||0),0);
  if(mgr){const a=app.querySelector("#shadd");if(a)a.onclick=()=>shiftModal(null,mems||[],pm);}
  const wkLabel=`${ws.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${we.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
  c.innerHTML=`
   <div class="card" style="padding:12px 16px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
     <button class="btn ghost sm" id="sh_prev">‹ Prev</button>
     <div style="font-weight:600;font-family:var(--fh)">${wkLabel}</div>
     <button class="btn ghost sm" id="sh_next">Next ›</button>
     ${mgr?`<select id="sh_member" class="filt" title="Member" style="margin-left:auto"><option value="all">All members</option>${shMemList.map(u=>`<option value="${u}" ${shiftsState.member===u?'selected':''}>${esc(nameOf(u))}</option>`).join("")}</select>`:''}
     <button class="btn ghost sm" id="sh_today" ${mgr?'':'style="margin-left:auto"'}>This week</button>
   </div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
     <div class="card stat"><div class="k">Planned</div><div class="v tnum">${plannedTotal.toFixed(1)}h</div><div class="sub">scheduled this week</div></div>
     <div class="card stat"><div class="k">Tracked</div><div class="v tnum">${hrs(trackedTotal).toFixed(1)}h</div><div class="sub">actually worked</div></div>
     <div class="card stat"><div class="k">Shifts</div><div class="v tnum">${list.length}</div><div class="sub">${mgr?'team':'yours'}</div></div>
   </div>
   <div class="card"><div class="sec-head" style="padding:16px 18px 10px"><h3>${mgr?'Team shifts':'My shifts'}</h3><span class="muted" style="font-size:13px">${wkLabel}</span></div>
   ${list.length?`<div style="overflow-x:auto"><table><thead><tr><th>Day</th>${mgr?'<th>Member</th>':''}<th>Shift</th><th class="tnum" style="text-align:right">Planned</th><th class="tnum" style="text-align:right">Tracked</th>${mgr?'<th></th>':''}</tr></thead><tbody>
     ${list.map(s=>{const ph=shiftHours(s.start_time,s.end_time);const tsec=trk[s.user_id+"|"+s.shift_date]||0;const th=hrs(tsec);
       return `<tr><td style="white-space:nowrap">${new Date(s.shift_date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</td>${mgr?`<td>${esc(nameOf(s.user_id))}</td>`:''}
       <td class="tnum">${hhmmShort(s.start_time)}–${hhmmShort(s.end_time)}${s.note?` <span class="muted" style="font-size:12px">· ${esc(s.note)}</span>`:''}</td>
       <td class="tnum" style="text-align:right">${ph.toFixed(1)}h</td><td class="tnum" style="text-align:right;${th>=ph*0.9?'color:var(--good)':th>0?'':'color:var(--faint)'}">${th>0?th.toFixed(1)+'h':'—'}</td>
       ${mgr?`<td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-she="${s.id}">Edit</button> <button class="btn ghost sm" data-shd="${s.id}">✕</button></td>`:''}</tr>`;}).join("")}
     </tbody></table></div>`:`<div class="empty">${ICON.shifts}<div>No shifts scheduled this week.${mgr?' Add one above.':''}</div></div>`}</div>`;
  c.querySelector("#sh_prev").onclick=()=>{const d=new Date(shiftsState.weekStart);d.setDate(d.getDate()-7);shiftsState.weekStart=d;loadView("shifts");};
  c.querySelector("#sh_next").onclick=()=>{const d=new Date(shiftsState.weekStart);d.setDate(d.getDate()+7);shiftsState.weekStart=d;loadView("shifts");};
  c.querySelector("#sh_today").onclick=()=>{shiftsState.weekStart=weekMonday(new Date());loadView("shifts");};
  const _shm=c.querySelector("#sh_member"); if(_shm)_shm.onchange=e=>{shiftsState.member=e.target.value;loadView("shifts");};
  enhanceSelects(c);
  c.querySelectorAll("[data-she]").forEach(b=>b.onclick=()=>{const s=list.find(x=>x.id===b.dataset.she);shiftModal(s,mems||[],pm);});
  c.querySelectorAll("[data-shd]").forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from("shifts").delete().eq("id",b.dataset.shd);loadView("shifts");});
}
function shiftModal(sh,mems,pm){
  const me=state.user.id;
  const nameOf=u=>pm[u]||(u===me?(state.user.user_metadata?.full_name||"You"):"Member");
  const memOpts=(mems||[]).map(m=>`<option value="${m.user_id}" ${sh&&sh.user_id===m.user_id?'selected':''}>${esc(nameOf(m.user_id))}</option>`).join("");
  showModal(`<h3 style="margin-bottom:14px">${sh?'Edit shift':'Add shift'}</h3>
    <div id="shmsg"></div>
    <div class="field"><label>Member</label><select id="sh_user" ${sh?'disabled':''}>${memOpts}</select></div>
    <div class="field"><label>Date</label><input id="sh_date" type="date" value="${sh?sh.shift_date:todayISODate()}"></div>
    <div class="row" style="gap:10px"><div class="field" style="flex:1"><label>Start</label><input id="sh_start" type="time" value="${sh?hhmmShort(sh.start_time):'09:00'}"></div>
      <div class="field" style="flex:1"><label>End</label><input id="sh_end" type="time" value="${sh?hhmmShort(sh.end_time):'17:00'}"></div></div>
    <div class="field"><label>Note (optional)</label><input id="sh_note" value="${sh?esc(sh.note||''):''}" placeholder="e.g. Morning shift"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="window._closeModal()">Cancel</button><button class="btn pri" id="sh_save">Save</button></div>`);
  document.getElementById("sh_save").onclick=async()=>{
    const rec={company_id:cid(),user_id:document.getElementById("sh_user").value,shift_date:document.getElementById("sh_date").value,start_time:document.getElementById("sh_start").value,end_time:document.getElementById("sh_end").value,note:document.getElementById("sh_note").value.trim()||null};
    if(!rec.user_id||!rec.shift_date){document.getElementById("shmsg").innerHTML=`<div class="msg err">Pick a member and date.</div>`;return;}
    let error;
    if(sh){({error}=await sb.from("shifts").update({shift_date:rec.shift_date,start_time:rec.start_time,end_time:rec.end_time,note:rec.note}).eq("id",sh.id));}
    else{rec.created_by=me;({error}=await sb.from("shifts").insert(rec));}
    if(error){document.getElementById("shmsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return;}
    _closeModal();loadView("shifts");
  };
}

/* =================== SETTINGS =================== */
function lockPill(plan){return `<span class="pill warn" style="font-size:11px">${plan} plan</span>`;}
async function viewSettings(){
  const c=content();
  const s=state.company.settings||{};
  const sc=s.screenshots||{}, idle=s.idle||{}, sch=s.schedule||{};
  const enabled=sc.enabled!==false, interval=sc.intervalMin||10, blur=!!sc.blur;
  const idleLimit=idle.limitMin||5;
  const startTime=sch.startTime||"09:00";
  const workdays=Array.isArray(sch.workdays)?sch.workdays:[1,2,3,4,5];
  const canFreq=planAtLeast("business"), canIdle=planAtLeast("pro");
  const dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]; const dayIdx=[1,2,3,4,5,6,0];
  const row=(label,hint,control)=>`<div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)"><div style="flex:1;min-width:0"><div style="font-weight:600">${label}</div>${hint?`<div class="hint">${hint}</div>`:''}</div><div style="flex:none">${control}</div></div>`;
  c.innerHTML=`
   <div class="card" style="padding:18px"><div class="sec-head"><div>
     <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600">Current plan</div>
     <div style="font-family:var(--fh);font-size:20px;font-weight:700;margin-top:2px">${esc(planName())}</div></div>
     <button class="btn sm" onclick="window.loadView('billing')">Change plan</button></div></div>

   <div class="card" style="padding:4px 18px 18px"><div class="sec-head" style="padding:16px 0 0"><h3>Screenshots</h3></div>
     ${row("Capture screenshots","Take periodic screenshots while the timer runs.",`<input type="checkbox" id="s_en" ${enabled?'checked':''} style="width:18px;height:18px">`)}
     ${row("How often"+(canFreq?"":" "+lockPill("Business")),canFreq?"Minutes between screenshots.":"Upgrade to Business to control screenshot frequency.",`<input type="number" id="s_int" min="3" max="60" value="${interval}" ${canFreq?'':'disabled'} style="width:80px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg)"> <span class="muted" style="font-size:13px">min</span>`)}
     ${row("Blur screenshots <span class='pill muted' style='font-size:11px'>coming soon</span>","Blur the image for privacy while still showing work is happening.",`<input type="checkbox" id="s_blur" ${blur?'checked':''} disabled style="width:18px;height:18px">`)}
   </div>

   <div class="card" style="padding:4px 18px 18px"><div class="sec-head" style="padding:16px 0 0"><h3>Idle detection ${canIdle?'':lockPill("Pro")}</h3></div>
     ${row("Pause after inactivity",canIdle?"Stop counting time after this many minutes of no keyboard or mouse.":"Upgrade to Pro for idle detection.",`<input type="number" id="s_idle" min="1" max="60" value="${idleLimit}" ${canIdle?'':'disabled'} style="width:80px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg)"> <span class="muted" style="font-size:13px">min</span>`)}
   </div>

   <div class="card" style="padding:4px 18px 18px"><div class="sec-head" style="padding:16px 0 0"><h3>Work schedule</h3><span class="muted" style="font-size:13px">used for attendance</span></div>
     ${row("Day starts at","When the working day is expected to start.",`<input type="time" id="s_start" value="${startTime}" style="padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--fg)">`)}
     ${row("Working days","",`<div style="display:flex;gap:6px;flex-wrap:wrap">${dayNames.map((d,i)=>`<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" class="s_wd" value="${dayIdx[i]}" ${workdays.includes(dayIdx[i])?'checked':''}> ${d}</label>`).join("")}</div>`)}
   </div>

   <div class="row" style="justify-content:flex-end"><span id="s_msg" class="muted" style="align-self:center;font-size:13px"></span><button class="btn pri" id="s_save">Save settings</button></div>`;

  c.querySelector("#s_save").onclick=async()=>{
    const btn=c.querySelector("#s_save"); btn.disabled=true; btn.textContent="Saving…";
    const settings={
      screenshots:{enabled:c.querySelector("#s_en").checked, intervalMin:Math.max(3,Math.min(60,+c.querySelector("#s_int").value||10)), blur:false},
      idle:{limitMin:Math.max(1,Math.min(60,+c.querySelector("#s_idle").value||5))},
      schedule:{startTime:c.querySelector("#s_start").value||"09:00", workdays:[...c.querySelectorAll(".s_wd:checked")].map(x=>+x.value)}
    };
    const {error}=await sb.from("companies").update({settings}).eq("id",cid());
    if(error){ c.querySelector("#s_msg").innerHTML=`<span style="color:var(--crit)">${esc(error.message)}</span>`; }
    else { state.company.settings=settings; c.querySelector("#s_msg").textContent="Saved ✓"; setTimeout(()=>{const m=c.querySelector("#s_msg");if(m)m.textContent="";},2000); }
    btn.disabled=false; btn.textContent="Save settings";
  };
}

/* =================== OPERATOR (platform admin) =================== */

  if(sres.error){ c.innerHTML=`<div class="card"><div class="msg err" style="margin:16px">${esc(sres.error.message)}</div></div>`; return; }

  c.innerHTML=`
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
     <div class="card stat"><div class="k">Companies</div><div class="v tnum">${s.companies||0}</div><div class="sub">+${s.companies_7d||0} this week</div></div>
     <div class="card stat"><div class="k">People</div><div class="v tnum">${s.members||0}</div><div class="sub">${s.active_7d||0} active this week</div></div>
     <div class="card stat"><div class="k">Est. MRR</div><div class="v tnum">${money(s.est_mrr||0)}</div><div class="sub">active subscriptions</div></div>

     <div class="card stat"><div class="k">Active today</div><div class="v tnum">${s.active_today||0}</div><div class="sub">people tracking</div></div>
   </div>
   <div class="grid" style="grid-template-columns:1fr 1fr">
     <div class="card" style="padding:16px 18px"><div class="sec-head"><h3>By plan</h3></div>
       <div class="row" style="margin-top:10px">${Object.keys(byPlan).length?Object.entries(byPlan).map(([k,v])=>`<span class="pill muted">${esc(planLabel[k]||k)}: ${v}</span>`).join(""):'<span class="muted">—</span>'}</div></div>
     <div class="card" style="padding:16px 18px"><div class="sec-head"><h3>By status</h3></div>
       <div class="row" style="margin-top:10px">${Object.keys(byStatus).length?Object.entries(byStatus).map(([k,v])=>`<span class="pill ${k==='active'?'good':k==='trialing'?'warn':'muted'}">${esc(k)}: ${v}</span>`).join(""):'<span class="muted">—</span>'}</div></div>
   </div>
   <div class="card">
     <div class="sec-head" style="padding:16px 18px 10px"><h3>Companies</h3><span class="pill muted">${cos.length}</span></div>
     <div style="overflow-x:auto"><table><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th class="tnum" style="text-align:right">Members</th><th>Joined</th><th>Last active</th></tr></thead><tbody>
     ${cos.length?cos.map(co=>`<tr>
       <td style="font-weight:600">${esc(co.name)}</td>
       <td><span class="pill muted">${esc(planLabel[co.plan_code]||co.plan_code)}</span></td>
       <td><span class="pill ${co.sub_status==='active'?'good':co.sub_status==='trialing'?'warn':'muted'}">${esc(co.sub_status)}</span></td>
       <td class="tnum" style="text-align:right">${co.members}</td>
       <td>${new Date(co.created_at).toLocaleDateString()}</td>
       <td>${co.last_activity?new Date(co.last_activity).toLocaleDateString():'<span class="muted">—</span>'}</td>
     </tr>`).join(""):`<tr><td colspan="6"><div class="empty">No companies yet.</div></td></tr>`}
     </tbody></table></div>
   </div>`;
}

/* =================== misc =================== */
function showModal(html){let bg=document.getElementById("modalbg");if(bg)bg.remove();
  bg=document.createElement("div");bg.className="modal-bg";bg.id="modalbg";
  bg.innerHTML=`<div class="card modal">${html}</div>`;bg.onclick=e=>{if(e.target===bg)_closeModal();};
  document.body.appendChild(bg);enhanceSelects(bg);}
window._closeModal=()=>{const b=document.getElementById("modalbg");if(b)b.remove();};
function alert2(m){const b=document.querySelector(".modal");if(b){let e=b.querySelector(".msg");if(!e){e=document.createElement("div");e.className="msg err";b.prepend(e);}e.className="msg err";e.textContent=m;}else showModal(`<div class="msg err">${esc(m)}</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="window._closeModal()">OK</button></div>`);}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);if(btn){const o=btn.textContent;btn.textContent="Copied!";setTimeout(()=>btn.textContent=o,1200);}}catch(e){const r=document.createRange();const s=document.createElement("span");s.textContent=t;document.body.appendChild(s);r.selectNode(s);getSelection().removeAllRanges();getSelection().addRange(r);try{document.execCommand("copy");}catch(_){}s.remove();if(btn){const o=btn.textContent;btn.textContent="Copied!";setTimeout(()=>btn.textContent=o,1200);}}}
window._signout=async()=>{await sb.auth.signOut();state={user:null,membership:null,company:null,view:"overview",data:{}};renderAuth();};
window.loadView=loadView;

boot();
</script>
