<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vora, the Fitma mascot">
  <defs>
    <linearGradient id="vbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9fd0"/>
      <stop offset="1" stop-color="#4a6f8f"/>
    </linearGradient>
    <linearGradient id="vspark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#ffb24d"/>
    </linearGradient>
  </defs>
  <!-- little feet -->
  <ellipse cx="50" cy="116" rx="9" ry="5" fill="#3f5d73"/>
  <ellipse cx="78" cy="116" rx="9" ry="5" fill="#3f5d73"/>
  <!-- body: a friendly rounded droplet -->
  <path d="M64 14
           C92 14 108 36 108 66
           C108 96 90 116 64 116
           C38 116 20 96 20 66
           C20 36 36 14 64 14 Z"
        fill="url(#vbody)" stroke="#2f4a60" stroke-width="3"/>
  <!-- belly -->
  <ellipse cx="64" cy="74" rx="30" ry="30" fill="#eef4f9"/>
  <!-- spark / Fitma upward mark on the belly -->
  <path d="M50 86 L60 72 L67 80 L80 60" fill="none" stroke="url(#vspark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 58 L82 57 L81 65" fill="none" stroke="url(#vspark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="51" cy="50" r="8.5" fill="#ffffff"/>
  <circle cx="77" cy="50" r="8.5" fill="#ffffff"/>
  <circle cx="53" cy="51" r="4" fill="#243444"/>
  <circle cx="79" cy="51" r="4" fill="#243444"/>
  <circle cx="54.6" cy="49.4" r="1.4" fill="#ffffff"/>
  <circle cx="80.6" cy="49.4" r="1.4" fill="#ffffff"/>
  <!-- smile -->
  <path d="M55 60 Q64 67 73 60" fill="none" stroke="#243444" stroke-width="3" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="42" cy="58" r="3.5" fill="#f3a9a0" opacity="0.7"/>
  <circle cx="86" cy="58" r="3.5" fill="#f3a9a0" opacity="0.7"/>
  <!-- antenna spark -->
  <line x1="64" y1="14" x2="64" y2="6" stroke="#2f4a60" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="5" r="4" fill="url(#vspark)"/>
</svg>
